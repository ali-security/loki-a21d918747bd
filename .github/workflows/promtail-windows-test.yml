name: Promtail Windows Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "space-separated test names to run instead of the full suite"
        required: false
        default: ""
        type: string
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        go-version: [ '1.21.9', '1.22.2' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      - name: Run promtail tests
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if ($env:TEST_FILTER) {
            $sel = '^(' + ($env:TEST_FILTER -replace ' ', '|') + ')$'
            go test .\clients\pkg\promtail\targets\windows\... -v -run $sel
          } else {
            go test .\clients\pkg\promtail\targets\windows\... -v
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }